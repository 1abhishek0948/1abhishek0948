<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 100" width="260" height="100" role="img" aria-label="GitHub"><title>GitHub</title><defs><linearGradient id="gv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B7BFF"></stop><stop offset="1" stop-color="#4DE1D2"></stop></linearGradient><linearGradient id="gh" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#8B7BFF"></stop><stop offset=".5" stop-color="#4DE1D2"></stop><stop offset="1" stop-color="#FF7AB6"></stop></linearGradient><linearGradient id="gtext" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset=".3" stop-color="#8B7BFF"></stop><stop offset=".65" stop-color="#4DE1D2"></stop><stop offset="1" stop-color="#FFFFFF"></stop><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="9s" repeatCount="indefinite"></animateTransform></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"></feGaussianBlur><feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter><filter id="blur14" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"></feGaussianBlur></filter><filter id="blur40" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"></feGaussianBlur></filter><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter></defs><style>text{font-family:Inter, 'SF Pro Display', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}.mono{font-family:'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace}.enter{animation:enter 14s cubic-bezier(.2,.7,.2,1) infinite backwards}@keyframes enter{0%{opacity:0;transform:translateY(18px)}6%{opacity:1;transform:translateY(0)}92%{opacity:1;transform:translateY(0)}98%,100%{opacity:0;transform:translateY(-8px)}}.ch{animation:ch 14s ease infinite backwards}@keyframes ch{0%{fill-opacity:0}6%{fill-opacity:1}92%{fill-opacity:1}98%,100%{fill-opacity:0}}.float{animation:float 6s ease-in-out infinite alternate}@keyframes float{from{transform:translateY(0)}to{transform:translateY(-7px)}}.pulse{animation:pulse 5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.05)}}.tw{animation:tw 4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.12}50%{opacity:.85}}.rise{animation:rise 10s linear infinite}@keyframes rise{from{transform:translateY(0);opacity:0}12%{opacity:.8}to{transform:translateY(-240px);opacity:0}}.b1{animation:d1 17s ease-in-out infinite alternate}.b2{animation:d2 21s ease-in-out infinite alternate}.b3{animation:d3 19s ease-in-out infinite alternate}@keyframes d1{to{transform:translate(120px,60px)}}@keyframes d2{to{transform:translate(-140px,-50px)}}@keyframes d3{to{transform:translate(-80px,90px)}}.beam{animation:beam 7s linear infinite}@keyframes beam{from{stroke-dashoffset:0}to{stroke-dashoffset:-1000}}.flow{animation:flow 1.4s linear infinite}@keyframes flow{to{stroke-dashoffset:-28}}.ring{animation:ring 3.2s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.35);opacity:0}}.blink{animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="30" y1="0" x2="230" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#8B7BFF"></stop><stop offset=".5" stop-color="#4DE1D2"></stop><stop offset="1" stop-color="#8B7BFF"></stop><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="200 0" dur="5s" repeatCount="indefinite"></animateTransform></linearGradient><clipPath id="bcp"><rect x="30" y="22" width="200" height="56" rx="28"></rect></clipPath></defs><g class="float" style="animation-duration:7s;animation-delay:-2s"><rect x="30" y="26" width="200" height="56" rx="28" fill="url(#bg)" filter="url(#blur14)"><animate attributeName="opacity" values=".25;.55;.25" dur="3.5s" repeatCount="indefinite"></animate></rect><rect x="30" y="22" width="200" height="56" rx="28" fill="#0E1120" stroke="url(#bg)" stroke-width="1.6"></rect><g clip-path="url(#bcp)"><rect y="22" width="46" height="56" fill="#fff" opacity=".28" transform="skewX(-22)"><animate attributeName="x" values="-40;320;320" keyTimes="0;.45;1" dur="4.5s" begin="1.4s" repeatCount="indefinite"></animate></rect></g><text x="130" y="57" text-anchor="middle" font-size="18" font-weight="700" fill="#EAEDF7" letter-spacing=".2">GitHub</text></g></svg>