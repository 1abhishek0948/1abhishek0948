,.2,1) infinite backwards}@keyframes enter{0%{opacity:0;transform:translateY(18px)}6%{opacity:1;transform:translateY(0)}92%{opacity:1;transform:translateY(0)}98%,100%{opacity:0;transform:translateY(-8px)}}.ch{animation:ch 14s ease infinite backwards}@keyframes ch{0%{fill-opacity:0}6%{fill-opacity:1}92%{fill-opacity:1}98%,100%{fill-opacity:0}}.float{animation:float 6s ease-in-out infinite alternate}@keyframes float{from{transform:translateY(0)}to{transform:translateY(-7px)}}.pulse{animation:pulse 5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.05)}}.tw{animation:tw 4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.12}50%{opacity:.85}}.rise{animation:rise 10s linear infinite}@keyframes rise{from{transform:translateY(0);opacity:0}12%{opacity:.8}to{transform:translateY(-240px);opacity:0}}.b1{animation:d1 17s ease-in-out infinite alternate}.b2{animation:d2 21s ease-in-out infinite alternate}.b3{animation:d3 19s ease-in-out infinite alternate}@keyframes d1{to{transform:translate(120px,60px)}}@keyframes d2{to{transform:translate(-140px,-50px)}}@keyframes d3{to{transform:translate(-80px,90px)}}.beam{animation:beam 7s linear infinite}@keyframes beam{from{stroke-dashoffset:0}to{stroke-dashoffset:-1000}}.flow{animation:flow 1.4s linear infinite}@keyframes flow{to{stroke-dashoffset:-28}}.ring{animation:ring 3.2s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.35);opacity:0}}.blink{animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g><defs><clipPath id="bdc"><rect width="1200" height="100" rx="24"></rect></clipPath><pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#F8F3EE" stroke-opacity=".05"></path><animateTransform attributeName="patter